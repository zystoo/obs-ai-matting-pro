name: Build Project
on:
  workflow_call:

jobs:
  check-event:
    name: Check GitHub Event Data
    runs-on: ubuntu-24.04
    outputs:
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      config: ${{ steps.check.outputs.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup
        run: |
          echo "pluginName=$(jq -r '.name' buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "pluginVersion=$(jq -r '.version' buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "commitHash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          echo "config=RelWithDebInfo" >> "$GITHUB_OUTPUT"

  linux-build:
    name: Build for Linux
    runs-on: ubuntu-24.04
    needs: check-event
    env:
      ORT_VERSION: "1.19.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install build-essential cmake ninja-build pkg-config unzip curl libobs-dev
      - name: Download ONNX Runtime
        run: |
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          echo "ORT_ROOT=/tmp/ort/onnxruntime-linux-x64-${ORT_VERSION}" >> $GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} -DCMAKE_INSTALL_PREFIX=/usr -DONNXRUNTIME_ROOT=${ORT_ROOT}
      - name: Build
        run: cmake --build build --parallel
      - name: Package
        run: |
          cmake --install build --prefix build_prefix --strip
          mkdir -p release
          cp "${ORT_ROOT}/lib/libonnxruntime.so"* build_prefix/lib/obs-plugins/ || true
          tar -C build_prefix -czf "release/${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-linux-x64-${{ needs.check-event.outputs.commitHash }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.pluginName }}-linux-x64
          path: release/

  macos-build:
    name: Build for macOS
    runs-on: macos-14
    needs: check-event
    env:
      ORT_VERSION: "1.19.2"
      OBS_VERSION: "31.1.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install cmake ninja pkg-config

      - name: Download and mount OBS (for libobs.dylib)
        run: |
          # Download OBS macOS DMG
          curl -L "https://github.com/obsproject/obs-studio/releases/download/${OBS_VERSION}/OBS-Studio-${OBS_VERSION}-macOS-Apple.dmg" -o /tmp/obs.dmg
          # Mount and extract libobs
          hdiutil attach /tmp/obs.dmg -mountpoint /tmp/obs_mount -nobrowse
          # Find libobs
          find /tmp/obs_mount -name "libobs*" -o -name "obs.framework" 2>/dev/null
          # Copy the library
          mkdir -p /tmp/obs_lib
          cp /tmp/obs_mount/OBS.app/Contents/Frameworks/libobs.dylib /tmp/obs_lib/ 2>/dev/null || \
          cp /tmp/obs_mount/OBS.app/Contents/Frameworks/libobs.framework/libobs /tmp/obs_lib/libobs.dylib 2>/dev/null || \
          find /tmp/obs_mount -name "libobs*" -exec cp {} /tmp/obs_lib/ \; 2>/dev/null || true
          # Also copy additional OBS frameworks
          cp -r /tmp/obs_mount/OBS.app/Contents/Frameworks/*.dylib /tmp/obs_lib/ 2>/dev/null || true
          hdiutil detach /tmp/obs_mount
          ls -la /tmp/obs_lib/

      - name: Download OBS source (for headers)
        run: |
          curl -L "https://github.com/obsproject/obs-studio/archive/refs/tags/${OBS_VERSION}.tar.gz" -o /tmp/obs-src.tar.gz
          tar -xzf /tmp/obs-src.tar.gz -C /tmp/
          # Create obsconfig.h (normally generated by CMake from obsconfig.h.in)
          printf '#pragma once\n#define OBS_DATA_PATH "data"\n#define OBS_PLUGIN_PATH "obs-plugins"\n#define OBS_PLUGIN_DESTINATION "obs-plugins"\n#define OBS_RELEASE_CANDIDATE 0\n#define OBS_BETA 0\n' > /tmp/obs-studio-${OBS_VERSION}/libobs/obsconfig.h

      - name: Download ONNX Runtime
        run: |
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          echo "ORT_ROOT=/tmp/ort/onnxruntime-osx-arm64-${ORT_VERSION}" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="13.0" \
            -DONNXRUNTIME_ROOT=${ORT_ROOT} \
            -DOBS_INCLUDE_DIR=/tmp/obs-studio-${OBS_VERSION}/libobs \
            -DOBS_LIB=/tmp/obs_lib/libobs.dylib

      - name: Build
        run: cmake --build build --parallel

      - name: Fix dynamic library paths
        run: |
          # Remove CI-specific rpaths (they don't exist on user's machine)
          install_name_tool -delete_rpath "/tmp/ort/onnxruntime-osx-arm64-${ORT_VERSION}/lib" build/obs-ai-matting-pro.so || true
          install_name_tool -delete_rpath "/tmp/obs_lib" build/obs-ai-matting-pro.so || true

          # Add @loader_path rpath (looks in the same directory as the binary)
          install_name_tool -add_rpath @loader_path build/obs-ai-matting-pro.so

          # Change ONNX Runtime link from @rpath to @loader_path (explicit path)
          install_name_tool -change \
            "@rpath/libonnxruntime.1.19.2.dylib" \
            "@loader_path/libonnxruntime.dylib" \
            build/obs-ai-matting-pro.so

          # Copy and fix ONNX Runtime dylib
          cp "${ORT_ROOT}/lib/libonnxruntime.dylib" build/libonnxruntime.dylib
          install_name_tool -id "@loader_path/libonnxruntime.dylib" build/libonnxruntime.dylib

          # Re-sign binaries (required after install_name_tool on Apple Silicon)
          codesign --force --sign - build/obs-ai-matting-pro.so
          codesign --force --sign - build/libonnxruntime.dylib

      - name: Package
        run: |
          # Create macOS .plugin bundle (standard OBS plugin format on macOS)
          PLUGIN_DIR="pkg_root/Library/Application Support/obs-studio/plugins/obs-ai-matting-pro.plugin"
          CONTENTS="${PLUGIN_DIR}/Contents"

          # Create bundle structure
          mkdir -p "${CONTENTS}/MacOS"
          mkdir -p "${CONTENTS}/Resources/locale"
          mkdir -p "${CONTENTS}/Resources/models"

          # Copy binary (rename .so to no extension, like obs-backgroundremoval)
          cp build/obs-ai-matting-pro.so "${CONTENTS}/MacOS/obs-ai-matting-pro"
          cp build/libonnxruntime.dylib "${CONTENTS}/MacOS/"

          # Copy locale data
          cp data/locale/en-US.ini "${CONTENTS}/Resources/locale/"

          # Copy RVM model (bundled in repo)
          cp data/models/rvm_mobilenetv3_fp32.onnx "${CONTENTS}/Resources/models/"

          # Create Info.plist (required for macOS bundle)
          cat > "${CONTENTS}/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.aimatting.obs-plugin</string>
              <key>CFBundleVersion</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleExecutable</key>
              <string>obs-ai-matting-pro</string>
              <key>CFBundleName</key>
              <string>AI Matting Pro</string>
          </dict>
          </plist>
          PLIST

          # Code-sign the entire bundle
          codesign --force --sign - --deep "${PLUGIN_DIR}"

          # Create .pkg installer
          mkdir -p release
          pkgbuild \
            --identifier com.aimatting.obs-plugin \
            --version ${{ needs.check-event.outputs.pluginVersion }} \
            --install-location / \
            --root pkg_root \
            "release/${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-macos-arm64.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.pluginName }}-macos-arm64
          path: release/*.pkg

  windows-build:
    name: Build for Windows
    runs-on: windows-2022
    needs: check-event
    env:
      ORT_VERSION: "1.19.2"
      OBS_VERSION: "31.1.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: cmd
        run: choco install -y cmake ninja

      - name: Download OBS Windows (for obs.dll)
        shell: bash
        run: |
          curl -L "https://github.com/obsproject/obs-studio/releases/download/${OBS_VERSION}/OBS-Studio-${OBS_VERSION}-Windows-x64.zip" -o /tmp/obs.zip
          mkdir -p /tmp/obs_app
          cd /tmp/obs_app && unzip -q /tmp/obs.zip
          # Find obs.dll
          find /tmp/obs_app -name "obs.dll" 2>/dev/null
          # Generate import library from dll
          OBS_DLL=$(find /tmp/obs_app -name "obs.dll" -print -quit)
          if [ -n "$OBS_DLL" ]; then
            OBS_DIR=$(dirname "$OBS_DLL")
            # Generate .lib from .dll using dumpbin + lib
            "$VCINSTALLDIR/Tools/MSVC/"*"/bin/Hostx64/x64/dumpbin.exe" /exports "$OBS_DLL" > /tmp/exports.txt 2>/dev/null || true
            echo "LIBRARY obs.dll" > /tmp/obs.def
            echo "EXPORTS" >> /tmp/obs.def
            grep -oP '^\s+\d+\s+[0-9A-F]+\s+\K\w+' /tmp/exports.txt >> /tmp/obs.def 2>/dev/null || true
            "$VCINSTALLDIR/Tools/MSVC/"*"/bin/Hostx64/x64/lib.exe" /def:/tmp/obs.def /out:/tmp/obs_app/obs.lib /machine:x64 2>/dev/null || true
          fi

      - name: Download OBS source (for headers)
        shell: bash
        run: |
          curl -L "https://github.com/obsproject/obs-studio/archive/refs/tags/${OBS_VERSION}.tar.gz" -o /tmp/obs-src.tar.gz
          tar -xzf /tmp/obs-src.tar.gz -C /tmp/
          # Create obsconfig.h (normally generated by CMake from obsconfig.h.in)
          printf '#pragma once\n#define OBS_DATA_PATH "data"\n#define OBS_PLUGIN_PATH "obs-plugins"\n#define OBS_PLUGIN_DESTINATION "obs-plugins"\n#define OBS_RELEASE_CANDIDATE 0\n#define OBS_BETA 0\n' > /tmp/obs-studio-${OBS_VERSION}/libobs/obsconfig.h

      - name: Download ONNX Runtime
        shell: bash
        run: |
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip" -o /tmp/ort.zip
          mkdir -p /tmp/ort
          cd /tmp/ort && unzip -q /tmp/ort.zip
          echo "ORT_ROOT=/tmp/ort/onnxruntime-win-x64-${ORT_VERSION}" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          OBS_LIB=$(find /tmp/obs_app -name "obs.lib" -print -quit 2>/dev/null)
          if [ -z "$OBS_LIB" ]; then
            OBS_LIB=$(find /tmp/obs_app -name "obs.dll" -print -quit 2>/dev/null)
          fi
          echo "Using OBS_LIB=$OBS_LIB"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} \
            -DONNXRUNTIME_ROOT="${ORT_ROOT}" \
            -DOBS_INCLUDE_DIR="/tmp/obs-studio-${OBS_VERSION}/libobs" \
            -DOBS_LIB="$OBS_LIB"

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p release/obs-plugins/64bit
          cp build/obs-ai-matting-pro.dll release/obs-plugins/64bit/ 2>/dev/null || \
          cp build/obs-ai-matting-pro.so release/obs-plugins/64bit/ 2>/dev/null || true
          cp "${ORT_ROOT}/lib/onnxruntime.dll" release/obs-plugins/64bit/ 2>/dev/null || true
          # Include locale data files
          mkdir -p release/data/obs-plugins/obs-ai-matting-pro/locale
          cp data/locale/en-US.ini release/data/obs-plugins/obs-ai-matting-pro/locale/
          # Include RVM model (bundled in repo)
          mkdir -p release/data/obs-plugins/obs-ai-matting-pro/models
          cp data/models/rvm_mobilenetv3_fp32.onnx release/data/obs-plugins/obs-ai-matting-pro/models/
          cd release && 7z a "../release/${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.pluginName }}-windows-x64
          path: release/*.zip
