name: Build Project
on:
  workflow_call:

jobs:
  check-event:
    name: Check GitHub Event Data
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.check.outputs.package }}
      codesign: ${{ steps.check.outputs.codesign }}
      config: ${{ steps.check.outputs.config }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup
        run: |
          echo "pluginName=$(jq -r '.name' buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "pluginVersion=$(jq -r '.version' buildspec.json)" >> "$GITHUB_OUTPUT"
          echo "commitHash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          echo "package=true" >> "$GITHUB_OUTPUT"
          echo "codesign=false" >> "$GITHUB_OUTPUT"
          echo "config=RelWithDebInfo" >> "$GITHUB_OUTPUT"

  macos-build:
    name: Build for macOS
    runs-on: macos-14
    needs: check-event
    env:
      ORT_VERSION: "1.19.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone OBS plugin template cmake
        run: |
          git clone --depth=1 https://github.com/obsproject/obs-plugintemplate.git /tmp/template
          mkdir -p cmake
          cp -r /tmp/template/cmake/* cmake/
          cp /tmp/template/.cmake-format.yaml .cmake-format.yaml || true

      - name: Download ONNX Runtime (macOS arm64)
        run: |
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          ln -s lib "/tmp/ort/onnxruntime-osx-arm64-${ORT_VERSION}/lib64" 2>/dev/null || true
          echo "ORT_ROOT=/tmp/ort/onnxruntime-osx-arm64-${ORT_VERSION}" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="13.0" \
            -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} \
            -DONNXRUNTIME_ROOT=${ORT_ROOT}

      - name: Build
        run: cmake --build build --config ${{ needs.check-event.outputs.config }} --parallel

      - name: Package
        run: |
          cmake --install build --config ${{ needs.check-event.outputs.config }} --prefix build_prefix --strip
          mkdir -p release
          cp "${ORT_ROOT}/lib/libonnxruntime.dylib" build_prefix/obs-plugins/ || true
          tar -C build_prefix -czf "release/${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-macos-arm64-${{ needs.check-event.outputs.commitHash }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-macos-arm64
          path: release/

  windows-build:
    name: Build for Windows
    runs-on: windows-2022
    needs: check-event
    env:
      ORT_VERSION: "1.19.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Clone OBS plugin template cmake
        shell: bash
        run: |
          git clone --depth=1 https://github.com/obsproject/obs-plugintemplate.git /tmp/template
          mkdir -p cmake
          cp -r /tmp/template/cmake/* cmake/

      - name: Download ONNX Runtime (Windows x64)
        shell: bash
        run: |
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip" -o /tmp/ort.zip
          mkdir -p /tmp/ort
          cd /tmp/ort && unzip -q /tmp/ort.zip
          echo "ORT_ROOT=/tmp/ort/onnxruntime-win-x64-${ORT_VERSION}" >> $GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} \
            -DONNXRUNTIME_ROOT="${ORT_ROOT}"

      - name: Build
        run: cmake --build build --config ${{ needs.check-event.outputs.config }} --parallel

      - name: Package
        shell: bash
        run: |
          cmake --install build --config ${{ needs.check-event.outputs.config }} --prefix build_prefix --strip
          mkdir -p release
          cp "${ORT_ROOT}/lib/onnxruntime.dll" build_prefix/obs-plugins/64bit/ || true
          cp "${ORT_ROOT}/lib/onnxruntime.lib" build_prefix/ || true
          cd build_prefix && 7z a "../release/${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-windows-x64
          path: release/

  linux-build:
    name: Build for Linux
    runs-on: ubuntu-24.04
    needs: check-event
    env:
      ORT_VERSION: "1.19.2"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install \
            build-essential ca-certificates cmake git \
            libobs-dev \
            libopencv-dev pkg-config ninja-build unzip

      - name: Download ONNX Runtime (Linux x64)
        run: |
          curl -L "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz" -o /tmp/ort.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
          ln -s lib "/tmp/ort/onnxruntime-linux-x64-${ORT_VERSION}/lib64" 2>/dev/null || true
          echo "ORT_ROOT=/tmp/ort/onnxruntime-linux-x64-${ORT_VERSION}" >> $GITHUB_ENV

      - name: Clone OBS plugin template cmake
        run: |
          git clone --depth=1 https://github.com/obsproject/obs-plugintemplate.git /tmp/template
          mkdir -p cmake
          cp -r /tmp/template/cmake/* cmake/

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ needs.check-event.outputs.config }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_GENERATOR=DEB \
            -DONNXRUNTIME_ROOT=${ORT_ROOT}

      - name: Build
        run: cmake --build build --config ${{ needs.check-event.outputs.config }} --parallel

      - name: Package
        run: |
          cmake --install build --config ${{ needs.check-event.outputs.config }} --prefix build_prefix --strip
          mkdir -p release
          cp "${ORT_ROOT}/lib/libonnxruntime.so"* build_prefix/obs-plugins/64bit/ || true
          cd build && cpack -G DEB
          cp *.deb ../release/ || true
          cd ..
          tar -C build_prefix -czf "release/${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-linux-x64-${{ needs.check-event.outputs.commitHash }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.check-event.outputs.pluginName }}-${{ needs.check-event.outputs.pluginVersion }}-linux-x64
          path: release/
