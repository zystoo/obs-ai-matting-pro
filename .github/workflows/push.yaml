name: Push
on:
  push:
    branches:
      - main
      - master
      - 'release/**'
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-project:
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit

  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    steps:
      - name: Check Release Tag
        id: check
        run: |
          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        if: fromJSON(steps.check.outputs.validTag)
        working-directory: release-assets
        run: |
          echo "### Checksums" > CHECKSUMS.txt
          for file in *.zip *.tar.gz *.deb; do
            [ -f "$file" ] || continue
            echo " ${file}: $(sha256sum "$file" | cut -d ' ' -f 1)" >> CHECKSUMS.txt
          done

      - name: Create Release
        if: fromJSON(steps.check.outputs.validTag)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ github.ref_name }}
          name: AI Matting Pro ${{ github.ref_name }}
          body_path: release-assets/CHECKSUMS.txt
          files: release-assets/*
